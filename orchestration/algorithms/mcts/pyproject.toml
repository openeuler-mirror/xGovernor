[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xgovernor-mcts"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18,<5", "xgovernor-tasks==0.1.0"]

[tool.setuptools]
packages = ["xgovernor_mcts", "xgovernor_mcts.benchmarks", "xgovernor_mcts.memory", "xgovernor_mcts.engine", "xgovernor_mcts.bridge", "xgovernor_mcts.tests"]
package-dir = {xgovernor_mcts = "."}
include-package-data = false

[tool.setuptools.package-data]
xgovernor_mcts = ["**/*.txt", "**/*.json", "**/*.js"]
