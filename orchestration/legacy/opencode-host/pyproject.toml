[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xgovernor-opencode-host"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["xgovernor-mcts==0.1.0", "xgovernor-tasks==0.1.0"]

[tool.setuptools]
packages = ["xgovernor_opencode_host"]
package-dir = {xgovernor_opencode_host = "."}
include-package-data = false

[tool.setuptools.package-data]
xgovernor_opencode_host = ["**/*.txt", "**/*.json", "**/*.js"]
