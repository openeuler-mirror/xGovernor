[package]
name = "xgovernor-server"
version.workspace = true
edition.workspace = true
license.workspace = true
autobins = false

[[bin]]
name = "xgovernor-server"
path = "src/main.rs"

[dependencies]
arc-swap.workspace = true
async-trait.workspace = true
axum.workspace = true
futures-util.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream.workspace = true
toml.workspace = true
tower = { workspace = true, features = ["util", "limit", "timeout"] }
tower-http = { workspace = true, features = ["limit"] }
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
session-protocol = { path = "../../crates/protocol/session" }
provider-protocol = { path = "../../crates/protocol/provider" }
backend = { path = "../../crates/backend" }
xgovernor-core = { path = "../../crates/core" }
xgovernor-manager = { path = "../../crates/manager" }
xgovernor-runtime-pi = { path = "../runtime-pi" }
dirs.workspace = true

[dev-dependencies]
http-body-util = "0.1"
tokio = { workspace = true, features = ["test-util"] }
